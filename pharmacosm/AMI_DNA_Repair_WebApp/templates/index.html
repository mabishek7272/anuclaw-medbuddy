<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum AMI DNA Repair</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Quantum AMI DNA Repair Prediction</h1>

    <h2>Upload Raw DNA Data (.vcf, .txt, .csv)</h2>
    <form id="convert-form" enctype="multipart/form-data">
        <input type="file" id="rawDNAFile" accept=".vcf, .txt, .csv" required>
        <button type="submit">Convert to AI Data</button>
    </form>

    <h2>Or Upload AI-Ready Data (.csv)</h2>
    <form id="predict-form" enctype="multipart/form-data">
        <input type="file" id="csvFile" accept=".csv" required>
        <button type="submit">Upload & Predict</button>
    </form>

    <h2>Predictions:</h2>
    <table id="results-table" border="1">
        <thead>
            <tr>
                <th>Radius Mean</th>
                <th>Texture Mean</th>
                <th>Perimeter Mean</th>
                <th>AMI Repair Prediction</th>
                <th>Repair Mechanism</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="/static/script.js"></script>
</body>
</html>
